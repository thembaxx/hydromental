let orb,hero,ring,dust,map,els=[],cam,rd,world,D=10,tx=0,ty=0;
/* ---------- three.js scene ---------- */
function init3D(){
rd=new THREE.WebGLRenderer({canvas:$('#gl'),alpha:true,antialias:true});rd.setPixelRatio(Math.min(devicePixelRatio,2));
const sc=new THREE.Scene();cam=new THREE.PerspectiveCamera(38,1,.1,80);
sc.add(new THREE.AmbientLight(0xffffff,.62));
const dl=new THREE.DirectionalLight(0xffffff,.85);dl.position.set(-3,5,6);sc.add(dl);
const pl=new THREE.PointLight(0x9fb4ff,.6);pl.position.set(4,2,4);sc.add(pl);
world=new THREE.Group();sc.add(world);hero=new THREE.Group();world.add(hero);
const c=document.createElement('canvas');c.width=1024;c.height=512;map=new THREE.CanvasTexture(c);
orb=new THREE.Mesh(new THREE.SphereGeometry(1,64,40),new THREE.MeshStandardMaterial({map,roughness:.3,metalness:.05}));orb.position.y=1;hero.add(orb);
ring=new THREE.Mesh(new THREE.TorusGeometry(2.3,.035,8,120),new THREE.MeshBasicMaterial({color:0x363B5E}));ring.rotation.x=Math.PI/2;world.add(ring);
const sh=new THREE.Mesh(new THREE.CircleGeometry(1.15,32),new THREE.MeshBasicMaterial({color:0,transparent:true,opacity:.22}));sh.rotation.x=-Math.PI/2;sh.position.y=.01;world.add(sh);
for(let i=0;i<12;i++){const m=new THREE.Mesh(new THREE.SphereGeometry(.1,16,12),new THREE.MeshStandardMaterial({color:0xffffff,emissive:0x8899ff,emissiveIntensity:.5}));world.add(m);els.push(m)}
const ap=[];for(let i=0;i<40;i++){const t=Math.PI-(i/39)*Math.PI*.62;ap.push(2.35*Math.cos(t),.2+2.6*Math.sin(t),0)}
const ag=new THREE.BufferGeometry();ag.setAttribute('position',new THREE.Float32BufferAttribute(ap,3));world.add(new THREE.Points(ag,new THREE.PointsMaterial({color:0xffffff,size:.075,transparent:true,opacity:.75})));
const dp=[];for(let i=0;i<90;i++)dp.push((Math.random()-.5)*16,(Math.random()-.3)*14,(Math.random()-.5)*6-3);
const dg=new THREE.BufferGeometry();dg.setAttribute('position',new THREE.Float32BufferAttribute(dp,3));dust=new THREE.Points(dg,new THREE.PointsMaterial({color:0xffffff,size:.04,transparent:true,opacity:.5}));sc.add(dust);
const fit=()=>{const w=app.clientWidth,h=app.clientHeight;rd.setSize(w,h,false);cam.aspect=w/h;D=Math.max(9,3.1/(Math.tan(19*Math.PI/180)*cam.aspect));S.shift=2*Math.tan(19*Math.PI/180)*D*.2;cam.updateProjectionMatrix()};
new ResizeObserver(fit).observe(app);fit();
let last=0,t=0;const sp=(x,v,g,k,d,dt)=>{v+=(g-x)*k*dt;v*=Math.exp(-d*dt);return[x+v*dt,v]};
(function loop(ms){requestAnimationFrame(loop);const dt=Math.min((ms-last)/1000||.016,.05);last=ms;t+=dt;
[S.sc,S.sv]=sp(S.sc,S.sv,1,170,9,dt);hero.scale.set(1+(1-S.sc)*.5,S.sc,1+(1-S.sc)*.5);
const st=Math.abs(S.vy)<.8&&!P;if(st){const q=Math.PI/2;S.vy+=(Math.round(orb.rotation.y/q)*q-orb.rotation.y)*60*dt}orb.rotation.y+=S.vy*dt;S.vy*=Math.exp(-(st?7:1.8)*dt);[S.rx,S.rv]=sp(S.rx,S.rv,0,60,6,dt);orb.rotation.x=S.rx;
[S.sp,S.spv]=sp(S.sp,S.spv,(S.hold||S.atom)?1.7:1,90,7,dt);
[S.wy,S.wv]=sp(S.wy,S.wv,open?S.shift:0,70,8,dt);world.position.y=S.wy;
const n=Math.min(12,E[cur].z);
els.forEach((m,i)=>{m.visible=i<n;const a=t*(.6+.12*(i%4))+i*2.1;if(i%2==0){const r=2.3*S.sp;m.position.set(r*Math.cos(a),.08,r*Math.sin(a))}else{const r=1.75*S.sp,th=i%4<2?.9:-.9,x=r*Math.cos(a);m.position.set(x*Math.cos(th),1+x*Math.sin(th),r*Math.sin(a))}});
cam.position.x+=((tx*.08*D)-cam.position.x)*Math.min(1,dt*4);cam.position.y=D*.24+ty*.05*D;cam.position.z=D;cam.lookAt(0,0,0);
rd.render(world.parent,cam)})(0);
}
function skin(){const e=E[cur],x=map.image.getContext('2d');x.shadowBlur=0;x.fillStyle=CAT[e.c][1];x.fillRect(0,0,1024,512);
const g=x.createLinearGradient(0,0,0,512);g.addColorStop(0,'rgba(255,255,255,.28)');g.addColorStop(.55,'rgba(255,255,255,0)');g.addColorStop(1,'rgba(0,0,40,.35)');x.fillStyle=g;x.fillRect(0,0,1024,512);
for(let k=0;k<110;k++){x.fillStyle='rgba(0,0,30,.10)';x.beginPath();x.arc(Math.random()*1024,40+Math.random()*432,4+Math.random()*12,0,7);x.fill()}
x.font='800 '+(e.s.length>2?150:e.s.length>1?190:230)+'px Nunito,sans-serif';x.textAlign='center';x.textBaseline='middle';x.shadowColor='rgba(5,10,40,.45)';x.shadowBlur=18;x.fillStyle=e.c=='t'?'#0B1031':'#fff';
[0,.25,.5,.75,1].forEach(u=>x.fillText(e.s,u*1024,262));map.needsUpdate=true}
/* ---------- UI ---------- */
const dark=()=>TH?TH!='day':matchMedia('(prefers-color-scheme: dark)').matches;
let TH='';try{TH=localStorage.getItem('th')||''}catch(e){}
function look(){if(!ring)return;ring.material.color.set(getComputedStyle(R).getPropertyValue('--ring').trim()||'#8FA6D8');dust.material.color.set(dark()?0xffffff:0x8fa6d8)}
function theme(t){TH=t;t?R.setAttribute('data-theme',t):R.removeAttribute('data-theme');try{localStorage.setItem('th',t)}catch(e){}
document.querySelectorAll('#mn button').forEach(b=>b.classList.toggle('on',b.dataset.t==t));setTimeout(look,40)}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>setTimeout(look,40));
let tt;function toast(s){const o=$('#ts');o.textContent=s;o.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>o.classList.remove('on'),1800)}
function stats(){$('#pr').textContent=found.size+' / '+E.length+' · '+xp+' XP';$('#c1').textContent=found.size+' / '+E.length}
function paint(){const e=E[cur],hex=CAT[e.c][1];
$('#gh').textContent=String(e.z).padStart(2,'0');
$('#pl').innerHTML='Period <span class="n">'+per(e)+'</span>';$('#pg').innerHTML='Group <span class="n">'+grp(e)+'</span>';
$('#in').innerHTML='<b>'+e.n+' <span class="n">'+e.m+'</span></b><small>'+CAT[e.c][0]+' · '+PH[e.f]+'</small>';
stats();
$('#pk').textContent=e.z+' protons · '+e.z+' electrons · '+Math.max(0,Math.round(parseFloat(e.m))-e.z)+' neutrons';
const tn=$('#tn');tn.style.background='radial-gradient(60vmax 60vmax at 50% 48%,'+hex+'20,transparent)';tn.style.animation='none';tn.offsetWidth;tn.style.animation='';
if(orb)skin()
document.querySelectorAll('.c').forEach(b=>{const i=+b.dataset.i,lk=!found.has(i);b.classList.toggle('lk',lk);b.classList.toggle('sel',i==cur);b.lastChild.textContent=lk?'?':E[i].s})}
function pick(i,b){const e=E[i];cur=i;if(!found.has(i)){found.add(i);xp+=10;toast('Discovered '+e.n+' · +10 XP');vib([12,30,12]);if(b)b.lastChild.classList.add('pop')}else vib(10);
S.vy=RM?0:14;S.sv=-5;$('#hint').style.opacity=0;save();paint()}
function nav(d){const c=E[cur],v=d=='u'||d=='d',sg=(d=='d'||d=='r')?1:-1;
const n=E.filter(e=>v?(e.g==c.g&&(e.p-c.p)*sg>0):(e.p==c.p&&(e.g-c.g)*sg>0)).sort((a,b)=>v?Math.abs(a.p-c.p)-Math.abs(b.p-c.p):Math.abs(a.g-c.g)-Math.abs(b.g-c.g))[0];
if(n)pick(n.z-1);else{S.vy=d=='r'?-6:d=='l'?6:0;S.rv=d=='u'?4:d=='d'?-4:0;S.sv=-3;vib(6)}}
function peek(on){S.hold=on;$('#pk').classList.toggle('on',on);if(on)vib(15)}
function closeAll(){document.querySelectorAll('.sheet,#dw').forEach(x=>x.classList.remove('open'));open=false}
function show(id,on){closeAll();if(on){$(id).classList.add('open');open=true}}
function drawer(on){show('#dw',on);if(on){const b=document.querySelector('.c.sel'),t=$('#tb');if(b)t.scrollTo({left:b.offsetLeft-t.clientWidth/2+28,top:b.offsetTop-40,behavior:'smooth'})}}
const shells=z=>{const o=[[1,2],[2,2],[2,6],[3,2],[3,6],[4,2],[3,10],[4,6],[5,2],[4,10],[5,6],[6,2],[4,14],[5,10],[6,6],[7,2],[5,14],[6,10],[7,6]],h=[];let r=z;for(const[n,c]of o){if(r<=0)break;const t=Math.min(r,c);h[n-1]=(h[n-1]||0)+t;r-=t}return h};
function detail(on){if(on){const e=E[cur],h=shells(e.z),col=CAT[e.c][1];$('#dn').textContent=e.n;
const ring=h.map((n,i)=>{const r=h.length>1?26+i*(98/(h.length-1)):70;return'<circle cx="130" cy="130" r="'+r+'" fill="none" stroke="currentColor" stroke-opacity=".25" stroke-width="1.5"/>'+[...Array(n)].map((_,k)=>{const a=k/n*6.283+i;return'<circle cx="'+(130+r*Math.cos(a))+'" cy="'+(130+r*Math.sin(a))+'" r="4" fill="'+col+'"/>'}).join('')}).join('');
const f=(l,v)=>'<div>'+l+'<b>'+v+'</b></div>';
$('#dbody').innerHTML='<svg viewBox="0 0 260 260" width="190" height="190" style="display:block;margin:0 auto" aria-label="Electron shells"><circle cx="130" cy="130" r="12" fill="'+col+'"/>'+ring+'</svg><div class="fa">'+f('Atomic no.',e.z)+f('Mass',e.m)+f('Phase',PH[e.f])+f('Period',per(e))+f('Group',grp(e))+f('Type',CAT[e.c][0])+'</div><p class="n" style="text-align:center;font-size:13px;color:var(--mut);margin:12px 14px 0">Shells (idealised): '+h.join(' · ')+'</p>'}show('#dt',on)}
let Q={};
function ask(){const pool=found.size>=6?[...found]:E.map((_,i)=>i),e=E[pool[Math.random()*pool.length|0]],t=Math.random()*3|0,k=['s','n','z'][t];
const q=t==0?'Symbol for <b>'+e.n+'</b>?':t==1?'Which element is <b class="n">'+e.s+'</b>?':'Atomic number of <b>'+e.n+'</b>?',ans=String(e[k]),set=new Set([ans]);
while(set.size<4)set.add(String(E[Math.random()*E.length|0][k]));
Q.ans=ans;Q.lock=0;const c=$('#qc');c.classList.remove('flip');void c.offsetWidth;c.classList.add('flip');
$('#qq').innerHTML=q;$('#qa').innerHTML=[...set].sort(()=>Math.random()-.5).map(v=>'<button class="opt">'+v+'</button>').join('');$('#qs').textContent='Streak '+streak}
function quiz(on){show('#qz',on);if(on)ask()}
function confetti(){for(let i=0;i<28;i++){const d=document.createElement('i');d.className='cf';d.style.cssText='left:50%;top:45%;background:'+Object.values(CAT)[i%8][1]+';--x:'+((Math.random()-.5)*340)+'px;--y:'+(-120-Math.random()*220)+'px;--r:'+(Math.random()*720)+'deg';app.appendChild(d);setTimeout(()=>d.remove(),1200)}}
$('#qa').onclick=e=>{const b=e.target.closest('.opt');if(!b||Q.lock)return;Q.lock=1;
if(b.textContent==Q.ans){b.classList.add('ok');streak++;xp+=5;vib([10,20,10]);toast('+5 XP');if(streak%3==0)confetti()}
else{b.classList.add('no');[...$('#qa').children].find(x=>x.textContent==Q.ans).classList.add('ok');streak=0;vib(30)}
save();stats();setTimeout(()=>quiz(true),1000)};
/* table grid */
$('#tb').innerHTML=[...Array(18)].map((_,i)=>'<em style="grid-column:'+(i+1)+';grid-row:1">'+(i+1)+'</em>').join('')+E.map((e,i)=>'<button class="c" data-i="'+i+'" aria-label="'+e.n+'" style="grid-column:'+e.g+';grid-row:'+(e.p+1)+';--c:'+CAT[e.c][1]+';--d:'+(i*14)+'ms"><i>'+e.z+'</i><b></b></button>').join('');
$('#tb').addEventListener('click',e=>{const b=e.target.closest('.c');if(!b)return;pick(+b.dataset.i,b);setTimeout(()=>drawer(false),420)});
/* gestures on the scene */
let P=null,ht;
app.addEventListener('pointerdown',e=>{if(e.target.closest('button,input,#dw,#mn,.wp,#in,.sheet'))return;P={x:e.clientX,y:e.clientY,lx:e.clientX,ly:e.clientY,m:0};ht=setTimeout(()=>{if(P&&P.m<8&&!open)peek(true)},450)});
app.addEventListener('pointermove',e=>{const r=app.getBoundingClientRect();tx=(e.clientX-r.left)/r.width-.5;ty=(e.clientY-r.top)/r.height-.5;if(!P)return;
const dx=e.clientX-P.lx,dy=e.clientY-P.ly;P.lx=e.clientX;P.ly=e.clientY;P.m=Math.max(P.m,Math.hypot(e.clientX-P.x,e.clientY-P.y));
if(P.m>8&&orb){clearTimeout(ht);S.vy=dx*.6;orb.rotation.y+=dx*.012;S.rx=Math.max(-.6,Math.min(.6,S.rx+dy*.005))}});
app.addEventListener('pointerup',e=>{if(!P)return;clearTimeout(ht);const dx=e.clientX-P.x,dy=e.clientY-P.y,q=P;P=null;
if(S.hold){peek(false);return}
if(q.m<8){if(open)closeAll();else{S.sv=-7;vib(8)}return}
if(Math.max(Math.abs(dx),Math.abs(dy))>70)Math.abs(dx)>Math.abs(dy)?nav(dx<0?'r':'l'):nav(dy<0?'d':'u')});
app.addEventListener('pointercancel',()=>{P=null;clearTimeout(ht);if(S.hold)peek(false)});
/* controls */
$('#au').onclick=()=>nav('u');$('#ad').onclick=()=>nav('d');$('#gb').onclick=()=>drawer(true);$('#ck').onclick=()=>drawer(false);$('#qb').onclick=()=>quiz(true);$('#qx').onclick=()=>closeAll();$('#dx').onclick=()=>closeAll();
$('#in').onclick=()=>detail(true);$('#in').onkeydown=e=>{if(e.key=='Enter')detail(true)};
function scrub(id,ax,ng,ps){const el=$(id);let st=null;
el.addEventListener('pointerdown',e=>{st=ax=='y'?e.clientY:e.clientX;el.setPointerCapture(e.pointerId);el.style.cursor='grabbing'});
el.addEventListener('pointermove',e=>{if(st==null)return;const v=ax=='y'?e.clientY:e.clientX,d=v-st;el.style.transform='translate'+ax.toUpperCase()+'('+Math.max(-16,Math.min(16,d*.3))+'px)';if(Math.abs(d)>34){st=v;nav(d>0?ps:ng);vib(4)}});
const end=()=>{st=null;el.style.transform='';el.style.cursor='grab'};el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end)}
scrub('#pl','y','u','d');scrub('#pg','x','l','r');
const tb=$('#tb'),pt=new Map();let cs=56,d0=1,c0=56;const setCs=v=>{cs=Math.max(30,Math.min(78,v));tb.style.setProperty('--cs',cs+'px')};
const dist=()=>{const[a,b]=[...pt.values()];return Math.hypot(a[0]-b[0],a[1]-b[1])};
tb.addEventListener('pointerdown',e=>{pt.set(e.pointerId,[e.clientX,e.clientY]);if(pt.size==2){d0=dist()||1;c0=cs}});
tb.addEventListener('pointermove',e=>{if(!pt.has(e.pointerId))return;pt.set(e.pointerId,[e.clientX,e.clientY]);if(pt.size==2)setCs(c0*dist()/d0)});
['pointerup','pointercancel','pointerleave'].forEach(n=>tb.addEventListener(n,e=>pt.delete(e.pointerId)));
tb.addEventListener('wheel',e=>{if(e.ctrlKey){e.preventDefault();setCs(cs*(e.deltaY<0?1.08:.93))}},{passive:false});
$('#ab').onclick=e=>{S.atom=!S.atom;e.currentTarget.classList.toggle('act',S.atom);vib(8)};
$('#mb').onclick=()=>$('#mn').classList.toggle('on');
$('#mn').onclick=e=>{const b=e.target.closest('button');if(b){theme(b.dataset.t);$('#mn').classList.remove('on')}};
$('#sb').onclick=()=>{const s=$('#si'),on=!s.classList.contains('on');s.classList.toggle('on',on);$('#pr').style.opacity=on?0:1;if(on)s.focus()};
$('#si').addEventListener('keydown',e=>{if(e.key!='Enter')return;const q=e.target.value.trim().toLowerCase(),i=E.findIndex(x=>x.s.toLowerCase()==q||x.n.toLowerCase().startsWith(q)||String(x.z)==q);
if(q&&i>-1){pick(i);e.target.value='';e.target.classList.remove('on');$('#pr').style.opacity=1;e.target.blur()}else{e.target.classList.add('no');setTimeout(()=>e.target.classList.remove('no'),400)}});
addEventListener('keydown',e=>{if(e.target.tagName=='INPUT')return;const m={ArrowLeft:'l',ArrowRight:'r',ArrowUp:'u',ArrowDown:'d'}[e.key];if(m)nav(m);if(e.key=='g')drawer(!open);if(e.key=='Escape')drawer(false)});
try{init3D()}catch(e){$('#hint').textContent='3D is unavailable in this browser'}
theme(TH);document.fonts&&document.fonts.ready.then(()=>orb&&skin());paint();
</script>
</body>
</html>
