name: Temporary particle formatting export
on:
  push:
    branches: [feat/r187-particle-visuals]
    paths: [.github/workflows/particle-format-export.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install matching formatter
        run: npm install -g oxfmt@0.74.0
      - name: Export formatted source
        run: |
          oxfmt --write components/canvas/atom-study-scene.tsx components/canvas/illustrative-electron-cloud.tsx
          for file in components/canvas/atom-study-scene.tsx components/canvas/illustrative-electron-cloud.tsx; do
            echo "BEGIN_FORMATTED:$file"
            base64 -w76 "$file"
            echo "END_FORMATTED:$file"
          done
