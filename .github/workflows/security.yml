name: Security
on:
  workflow_call:
  schedule:
    - cron: "23 7 * * 1"
permissions:
  contents: read
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install the locked dependency graph without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Reject known high and critical dependency vulnerabilities
        run: pnpm security:audit
      - name: Report security coverage
        env:
          ADVANCED_SECURITY_ENABLED: ${{ github.event.repository.visibility == 'public' || vars.ADVANCED_SECURITY_ENABLED == 'true' }}
        run: |
          echo 'The full locked dependency audit is enforced on every CI run and weekly.' >> "$GITHUB_STEP_SUMMARY"
          if [ "$ADVANCED_SECURITY_ENABLED" = 'true' ]; then
            echo 'CodeQL and PR dependency review are enabled. Failures block CI.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'CodeQL and dependency review are unavailable on this private repository. Enable the GitHub features, then set ADVANCED_SECURITY_ENABLED=true to enforce them. See docs/deployment.md.' >> "$GITHUB_STEP_SUMMARY"
          fi
  codeql:
    name: CodeQL (JavaScript and TypeScript)
    # Private repositories must enable the licensed GitHub features before opting in.
    if: github.event.repository.visibility == 'public' || vars.ADVANCED_SECURITY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
  dependency-review:
    if: github.event_name == 'pull_request' && (github.event.repository.visibility == 'public' || vars.ADVANCED_SECURITY_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
