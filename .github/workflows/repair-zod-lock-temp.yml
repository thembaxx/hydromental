name: Temporary locked Zod remediation validation
on:
  push:
    branches: [fix/zod-cli-advisory-oct30]
    paths:
      - pnpm-workspace.yaml
      - .github/workflows/repair-zod-lock-temp.yml
permissions:
  contents: write
jobs:
  regenerate-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Regenerate only the Zod override lockfile
        run: pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
      - name: Verify the locked install, advisory audit and Zod graph
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm why zod
          pnpm security:audit
      - name: Validate CLI compatibility and application
        run: |
          pnpm check
          pnpm test:unit
          pnpm build
          pnpm exec vercel --version
          pnpm exec vercel build --help > /dev/null
      - name: Commit generated lockfile only after successful validation
        run: |
          git add pnpm-lock.yaml
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'security: regenerate locked patched Zod CLI graph'
            git push origin HEAD:refs/heads/fix/zod-cli-advisory-oct30
          fi
